name: Import original Bedrock packs

on:
  push:
    branches:
      - main
    paths:
      - ".import/ancient-abyss-*.b64"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore original Behavior Pack and Resource Pack
        shell: bash
        run: |
          set -euo pipefail
          cat .import/ancient-abyss-*.b64 | base64 --decode > /tmp/ancient_abyss.zip
          unzip -oq /tmp/ancient_abyss.zip 'behavior_pack/*' 'resource_pack/*' -d .
          test -f behavior_pack/manifest.json
          test -f resource_pack/manifest.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add behavior_pack resource_pack
          git rm -r .import
          git rm .github/workflows/import-packs.yml
          git commit -m "Import original Behavior Pack and Resource Pack"
          git push origin HEAD:main
